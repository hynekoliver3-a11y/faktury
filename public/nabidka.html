<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Cenová nabídka</title>
<link rel="icon" href="/icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="wrap">
  <div id="obsah"><p class="muted">Načítám nabídku…</p></div>

  <div id="akce" class="card no-print hidden" style="margin-top:14px">
    <p class="section-title">Odpověď dodavateli</p>
    <label for="zprava" style="margin-top:0">Zpráva (nepovinná)</label>
    <textarea id="zprava" style="min-height:60px" placeholder="Např.: Vyhovuje mi úterý odpoledne."></textarea>
    <div class="row" style="margin-top:12px">
      <button class="btn accent" id="prijmout">Přijmout nabídku</button>
      <button class="btn" id="odmitnout">Odmítnout</button>
    </div>
    <div id="kanaly" class="hidden" style="margin-top:12px">
      <div class="muted small" style="margin-bottom:8px">Odpověď odeslat přes:</div>
      <div class="row">
        <a class="btn" id="k-sms">SMS</a>
        <a class="btn" id="k-wa" target="_blank" rel="noopener">WhatsApp</a>
        <a class="btn" id="k-mail">E-mail</a>
      </div>
    </div>
    <div class="row" style="margin-top:12px">
      <button class="btn" onclick="print()">Stáhnout PDF / Tisk</button>
      <a class="btn hidden" id="volat">Zavolat</a>
    </div>
  </div>
</div>

<script type="module">
import { renderNabidka, dekoduj, spocitej, kc } from "/shared.js";
const $ = (s) => document.querySelector(s);

let q = null;
try { q = await dekoduj(location.hash.slice(1)); } catch {}

if (!q?.dodavatel || !Array.isArray(q.polozky)) {
  $("#obsah").innerHTML = '<div class="card"><h2>Nabídka nenalezena</h2><p class="muted">Odkaz je neúplný. Zkuste ho otevřít znovu celý, nebo požádejte dodavatele o nový.</p></div>';
} else {
  const d = q.dodavatel;
  document.title = `Cenová nabídka ${q.cislo} – ${d.nazev}`;
  $("#obsah").innerHTML = renderNabidka(q);
  $("#akce").classList.remove("hidden");
  const tel = (d.telefon || "").replace(/[^\d+]/g, "");
  if (tel) { $("#volat").href = "tel:" + tel; $("#volat").classList.remove("hidden"); }

  const odpovez = (prijato) => {
    const zprava = `${prijato ? "Přijímám" : "Odmítám"} cenovou nabídku č. ${q.cislo} („${q.predmet}“, ${kc(spocitej(q).celkem)}).` +
      ($("#zprava").value.trim() ? "\n" + $("#zprava").value.trim() : "") + (q.zakaznik?.jmeno ? "\n" + q.zakaznik.jmeno : "");
    const enc = encodeURIComponent(zprava);
    $("#k-sms").href = `sms:${tel}?&body=${enc}`;
    $("#k-wa").href = `https://wa.me/${tel.replace(/^\+/, "").replace(/^(\d{9})$/, "420$1")}?text=${enc}`;
    $("#k-mail").href = `mailto:${encodeURIComponent(d.email || "")}?subject=${encodeURIComponent((prijato ? "Přijetí" : "Odmítnutí") + " nabídky " + q.cislo)}&body=${enc}`;
    $("#k-sms").classList.toggle("hidden", !tel);
    $("#k-wa").classList.toggle("hidden", !tel);
    $("#k-mail").classList.toggle("hidden", !d.email);
    $("#kanaly").classList.remove("hidden");
    $("#kanaly").scrollIntoView({ behavior: "smooth", block: "center" });
  };
  $("#prijmout").onclick = () => odpovez(true);
  $("#odmitnout").onclick = () => odpovez(false);
}
</script>
</body>
</html>
